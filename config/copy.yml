errors:
  constraints_too_tight: "We tried {n} arrangements but couldn't find one that satisfies all your rules. Try relaxing a rule — for example, allow 3 per group instead of 2."
  beacon_unreachable: "Couldn't reach the internet randomness service. Try again in a moment, or use dice or a custom number instead."
  invalid_verify_link: "This verification link doesn't look right. Make sure you copied the full link."
  teams_too_few: "You need at least as many items as slots to run a draw."
  teams_too_many: "That's a lot of items! The maximum is {max}."
  seed_empty: "Enter a public number before running the draw."

