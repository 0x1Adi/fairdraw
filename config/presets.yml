presets:
  - id: "fifa_2026"
    name: "FIFA World Cup 2026"
    description: "48 teams → 12 groups of 4 (one per pot)"
    category: "sports"
    featured: true
    icon: "trophy"
    group_count: 12
    group_size: 4
    assignment_type: "permutation_per_pot"
    pots:
      - id: "pot1"
        name: "Pot 1"
        locked: true
        teams: []
      - id: "pot2"
        name: "Pot 2"
        locked: false
        teams: []
      - id: "pot3"
        name: "Pot 3"
        locked: false
        teams: []
      - id: "pot4"
        name: "Pot 4"
        locked: false
        teams: []
    constraints:
      - type: "max_per_group"
        field: "confederation"
        max: 2
        description: "No group has more than 2 teams from same confederation"
      - type: "fixed_position"
        field: "is_host"
        group: 0
        description: "Host nation placed in Group A"
    teams_file: "data/fifa_2026_teams.yml"

